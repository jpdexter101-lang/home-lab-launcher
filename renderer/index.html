<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Home Lab Launcher</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="panel">
    <div id="header">
      <div id="brand">
        <span id="brand-glyph"></span>
        <span id="brand-text">
          <span id="brand-title"></span>
          <span id="brand-count"></span>
        </span>
      </div>
      <div id="header-actions">
        <button id="settings-btn" title="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button id="collapse-btn" title="Collapse / expand">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6,9 12,15 18,9"/></svg>
        </button>
        <button id="pin-btn" title="Un-pin from always-on-top">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><line x1="12" y1="11" x2="12" y2="21"/></svg>
        </button>
        <button id="quit-btn" title="Quit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
        </button>
      </div>
    </div>
    <div id="grid"></div>

    <div id="onboarding">
      <div id="onboarding-card">
        <div id="onboarding-glyph"></div>
        <h1>Name your home lab</h1>
        <p>This is what shows in the header. You can change it later in Settings.</p>
        <input id="onboarding-name" type="text" placeholder="e.g. My Home Lab" maxlength="40" autofocus />
        <div id="onboarding-icons"></div>
        <button id="onboarding-submit">Get Started</button>
      </div>
    </div>
  </div>

  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
